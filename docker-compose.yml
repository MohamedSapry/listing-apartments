services:
  # PostgreSQL Database with persistent storage
  postgres:
    image: postgres:15-alpine
    container_name: apartment_db
    environment:
      POSTGRES_DB: apartment_listing
      POSTGRES_USER: apartment_user
      POSTGRES_PASSWORD: apartment_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_user -d apartment_listing"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - apartment_network

  # Database Migration Service (runs once, no automatic seeding)
  migrate:
    build: 
      context: ./backend
      target: production
    container_name: apartment_migrate
    environment:
      DATABASE_URL: postgresql://apartment_user:apartment_pass@postgres:5432/apartment_listing
      NODE_ENV: production
    command: sh -c "npx prisma db push && echo 'Database migrations completed successfully.'"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"  # Run once and exit
    networks:
      - apartment_network

  # Backend API Service
  backend:
    build: 
      context: ./backend
      target: production
    container_name: apartment_backend
    environment:
      DATABASE_URL: postgresql://apartment_user:apartment_pass@postgres:5432/apartment_listing
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - migrate  # Wait for migrations to complete
    restart: unless-stopped
    networks:
      - apartment_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Application
  frontend:
    build: 
      context: ./frontend
      target: production
    container_name: apartment_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apartment_network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local

# Custom network for service isolation
networks:
  apartment_network:
    driver: bridge
